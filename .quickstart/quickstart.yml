dbt_versions: ">=1.3.0 <3.0.0"

multi_connector_config:
  claude:
    database_key: claude_database
    union_schema_key: claude_union_schemas
    supported_vars:
      claude__enterprise_user_activity_pass_through_metrics:
        type: dictionary
        description: "Additional numeric `ENTERPRISE_USER_ACTIVITY` metric columns to sum into `claude__user_summary`"
        display_name: "Additional Enterprise User Activity Metrics"
  openai:
    database_key: openai_database
    union_schema_key: openai_union_schemas
    public_models:
      - openai__compliance_cost_report
    supported_vars:
      openai__code_report_credit_rate:
        type: string
        description: "Currency amount per Codex credit, used to estimate OpenAI code report costs"
        display_name: "Codex Credit Rate (USD per credit)"
      openai__cost_passthrough_metrics:
        type: dictionary
        description: "Additional numeric `COST` columns to sum into `openai__cost_usage_report`"
        display_name: "Additional Cost Metrics"
      openai__completion_passthrough_metrics:
        type: dictionary
        description: "Additional numeric `COMPLETION` columns to sum into `openai__cost_usage_report`"
        display_name: "Additional Completion Metrics"
      openai__codex_usage_passthrough_metrics:
        type: dictionary
        description: "Additional `CODEX_USAGE` columns to include in `openai__code_report`"
        display_name: "Additional Codex Usage Columns"
      openai__codex_usage_model_passthrough_metrics:
        type: dictionary
        description: "Additional numeric `CODEX_USAGE_MODEL` columns to sum into `openai__code_report`"
        display_name: "Additional Codex Usage Model Metrics"
      openai__compliance_cost_passthrough_metrics:
        type: dictionary
        description: "Additional `COMPLIANCE_COSTS_ORGANIZATION_LOG` columns to include in `openai__compliance_cost_report`"
        display_name: "Additional Compliance Cost Columns"
      openai__compliance_cost_billing_passthrough_metrics:
        type: dictionary
        description: "Additional numeric `COSTS_ORGANIZATION_LOG_BILLING` columns to sum into `openai__compliance_cost_report`"
        display_name: "Additional Compliance Cost Billing Metrics"

table_variables:
  claude__using_cost_report:
    - cost_report
  claude__using_enterprise_user_cost_report:
    - enterprise_user_cost_report
  claude__using_message_usage_report:
    - message_usage_report
  claude__using_enterprise_user_usage_report:
    - enterprise_user_usage_report
  claude__using_claude_code_usage_report:
    - claude_code_usage_report
  claude__using_claude_code_usage_report_model_breakdown:
    - claude_code_usage_report_model_breakdown
  claude__using_users:
    - users
  claude__using_enterprise_user_actor:
    - enterprise_user_actor
  claude__using_api_key:
    - api_key
  claude__using_enterprise_user_activity:
    - enterprise_user_activity
  claude__using_organization:
    - organization
  claude__using_workspace:
    - workspace
  claude__using_workspace_member:
    - workspace_member
  openai__using_cost:
    - cost
  openai__using_completion:
    - completion
  openai__using_embedding:
    - embedding
  openai__using_audio_transcription:
    - audio_transcription
  openai__using_audio_speech:
    - audio_speech
  openai__using_image:
    - image
  openai__using_moderation:
    - moderation
  openai__using_web_search_call:
    - web_search_call
  openai__using_file_search_call:
    - file_search_call
  openai__using_codex_usage:
    - codex_usage
  openai__using_codex_usage_model:
    - codex_usage_model
  openai__using_project:
    - project
  openai__using_project_api_key:
    - project_api_key
  openai__using_project_user:
    - project_user
  openai__using_project_user_role:
    - project_user_role
  openai__using_users_role:
    - users_role
  openai__using_invite:
    - invite
  openai__using_compliance_cost:
    - compliance_costs_organization_log
    - compliance_costs_organization_log_billing
    - compliance_costs_log_file
  openai__using_compliance_users:
    - users

destination_configurations:
  databricks:
    dispatch:
      - macro_namespace: dbt_utils
        search_order: [ 'spark_utils', 'dbt_utils' ]

public_models: [
  "ai_reporting__cost_report",
  "ai_reporting__code_report",
  "ai_reporting__enterprise_report",
  "ai_reporting__user_summary"
]
