title: AI Coding Activity
text: |
  Claude Code and Codex CLI activity. Sessions are Claude sessions or Codex
  threads; lines of code measure assistant activity, not developer productivity.
  Estimated USD and Codex credits are shown separately and are not added to the
  spend board. Missing estimates remain blank, not zero. OpenAI estimates require
  `openai__code_report_credit_rate`; Claude estimates require model breakdown data.
  Unidentified activity contributes to volume but is excluded from user counts
  and rankings.
variables:
  period:
    input: daterange
  platform:
    options:
      query: platforms
queries:
  platforms:
    dialect: duckdb
    sql: |
      select distinct platform
      from {{ ref('ai_reporting__code_report') }}
      order by 1
  activity:
    dialect: duckdb
    sql: |
      select date_day, platform, source_relation, user_id, user_email,
        count_sessions, count_lines_of_code_added, count_lines_of_code_removed,
        total_tokens, estimated_cost, credits,
        case when user_id is not null then 'id:' || user_id
          when user_email is not null then 'email:' || user_email end as user_identity
      from {{ ref('ai_reporting__code_report') }}
      where {{ filter_date_range('date_day', period) }}
        and {{ filter('platform', platform) }}
  daily:
    sql: |
      with observed as (
        select date_day, platform,
          sum(total_tokens) as total_tokens,
          sum(count_sessions) as sessions_or_threads,
          count(distinct (source_relation, user_identity)) filter (
            where (count_sessions > 0 or total_tokens > 0
              or count_lines_of_code_added > 0 or count_lines_of_code_removed > 0)
              and user_identity is not null
          ) as active_users
        from {{ queries.activity.cache }}
        group by 1, 2
      )
      select cast(days.day as date) as date_day, platforms.platform,
        observed.total_tokens, observed.active_users, observed.sessions_or_threads
      from generate_series(
        (select min(date_day) from observed),
        (select max(date_day) from observed), interval 1 day
      ) as days(day)
      cross join (select distinct platform from observed) platforms
      left join observed on observed.date_day = cast(days.day as date)
        and observed.platform = platforms.platform
      order by 1, 2
  users:
    sql: |
      select platform, source_relation, max(user_id) as user_id,
        arg_max(user_email, date_day) as user_email,
        sum(total_tokens) as total_tokens,
        sum(count_sessions) as sessions_or_threads,
        sum(estimated_cost) as estimated_usd,
        count(distinct date_day) filter (where estimated_cost is not null) as days_with_cost_estimate,
        count(distinct date_day) as reported_days,
        sum(credits) as codex_credits
      from {{ queries.activity.cache }}
      where user_identity is not null
      group by platform, source_relation, user_identity
      order by 5 desc nulls last, 1, 2, 3, 4
      limit 20
    formats:
      estimated_usd: currency_full
charts:
  daily_tokens:
    type: line
    notes: Missing reporting days are null so the line breaks rather than implying usage.
    warnings_ignore: [WARN-Y-ENCODING-MOSTLY-NULL]
    query: daily
    x: date_day
    color: platform
    y: total_tokens
    title: Daily Coding Tokens by Platform
  daily_users:
    type: line
    notes: Missing reporting days are null so the line breaks rather than implying usage.
    warnings_ignore: [WARN-Y-ENCODING-MOSTLY-NULL]
    query: daily
    x: date_day
    color: platform
    y: active_users
    title: Daily Active Coding Users
  daily_sessions:
    type: line
    notes: Missing reporting days are null so the line breaks rather than implying usage.
    warnings_ignore: [WARN-Y-ENCODING-MOSTLY-NULL]
    query: daily
    x: date_day
    color: platform
    y: sessions_or_threads
    title: Daily Sessions and Threads
  users:
    type: table
    query: users
    title: Top 20 Coding Users by Tokens
rows:
  - daily_tokens
  - cols:
      - daily_users
      - daily_sessions
  - users
