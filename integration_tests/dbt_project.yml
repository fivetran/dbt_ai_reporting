    openai_compliance_schema: ai_reporting_integration_tests
    openai_cost_identifier: "openai_cost"
    openai_completion_identifier: "openai_completion"
    openai_embedding_identifier: "openai_embedding"
    openai_audio_transcription_identifier: "openai_audio_transcription"
    openai_audio_speech_identifier: "openai_audio_speech"
    openai_image_identifier: "openai_image"
    openai_moderation_identifier: "openai_moderation"
    openai_web_search_call_identifier: "openai_web_search_call"
    openai_file_search_call_identifier: "openai_file_search_call"
    openai_codex_usage_identifier: "openai_codex_usage"
    openai_codex_usage_model_identifier: "openai_codex_usage_model"
    openai_project_identifier: "openai_project"
    openai_project_api_key_identifier: "openai_project_api_key"
    openai_users_identifier: "openai_users"
    openai_project_user_identifier: "openai_project_user"
    openai_project_user_role_identifier: "openai_project_user_role"
    openai_project_role_identifier: "openai_project_role"
