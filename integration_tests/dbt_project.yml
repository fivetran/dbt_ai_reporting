name: 'ai_reporting_integration_tests'
version: '0.1.0'
config-version: 2
profile: 'integration_tests'

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  ai_reporting:
    +schema: "{{ 'ai_reporting_integrations_tests_sqlw' if target.name == 'databricks-sql' else 'ai_reporting' }}"

vars:
