    claude__users_identifier: "claude_users"
    claude__enterprise_user_actor_identifier: "claude_enterprise_user_actor"
    claude__api_key_identifier: "claude_api_key"
    claude__workspace_identifier: "claude_workspace"
    claude__enterprise_user_activity_identifier: "claude_enterprise_user_activity"
    claude__workspace_member_identifier: "claude_workspace_member"
    claude__organization_identifier: "claude_organization"

