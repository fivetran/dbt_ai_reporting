# Only set if not using default adapter ranges
# dbt_adapter_versions:
#   snowflake: ">=1.3.0,<2.0.0"
#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "claude_schema"
additional_schema_variables:
  - "openai_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: true
include_duckdb: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "Credit Rate"
    vars:
      openai__code_report_credit_rate: 0.04
    include_incremental: false

  - name: "Compliance Disabled"
    vars:
      openai__using_compliance_cost: false
      openai__using_compliance_users: false
    include_incremental: false

  - name: "Optional Claude tables disabled"
    vars:
      claude__using_organization: false
      claude__using_workspace: false
      claude__using_users: false
      claude__using_enterprise_user_activity: false
    include_incremental: false

  - name: "Optional OpenAI tables disabled"
    vars:
      openai__using_project: false
      openai__using_project_user: false
      openai__using_invite: false
      openai__using_codex_usage_model: false
    include_incremental: false

  - name: "Claude only"
    vars:
      openai__using_cost: false
      openai__using_completion: false
      openai__using_embedding: false
      openai__using_audio_transcription: false
      openai__using_audio_speech: false
      openai__using_image: false
      openai__using_moderation: false
      openai__using_web_search_call: false
      openai__using_file_search_call: false
      openai__using_codex_usage: false
      openai__using_codex_usage_model: false
      openai__using_project_user: false
    include_incremental: false

  - name: "OpenAI only"
    vars:
      claude__using_cost_report: false
      claude__using_message_usage_report: false
      claude__using_enterprise_user_cost_report: false
      claude__using_enterprise_user_usage_report: false
      claude__using_claude_code_usage_report: false
      claude__using_enterprise_user_actor: false
    include_incremental: false

  - name: "Stress test vars"
    vars:
      # Nulls optional columns in Claude models
      claude__using_users: false
      claude__using_workspace: false
      claude__using_workspace_member: false
      claude__using_enterprise_user_activity: false
      claude__using_claude_code_usage_report_model_breakdown: false
      # Nulls optional columns + partial reporting in OpenAI models
      openai__using_project: false
      openai__using_codex_usage_model: false
      openai__using_compliance_cost: false
      openai__using_compliance_users: false
      openai__code_report_credit_rate: 0.04
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
